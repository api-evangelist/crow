name: Crow
description: >-
  Crow is a Y Combinator (Winter 2026) company building an AI infrastructure
  platform that makes any web or mobile application AI-native. Instead of a
  simple chatbot, Crow embeds an agent that connects to a product's own APIs
  and MCP servers, executes workflows, navigates users between pages, and calls
  server-side and client-side tools from natural-language commands. Developers
  add Crow with a single script tag or the React SDK, point it at a REST API
  via OpenAPI or at an MCP server, and configure the agent in a sandbox. Crow
  also ships the Envoy CLI, which reads a backend codebase and auto-generates
  and deploys an MCP server, plus a headless client and React UI component
  library (Widget and Copilot). Crow is initially positioned for commercial
  real estate but the platform applies to any software product.
